name: Build and Release MK8DNum

on:
    push:
        branches: [main]

permissions:
    contents: write

concurrency:
    group: mk8dnum-auto-release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Check out source and tags
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install font build dependency
              run: python -m pip install -r requirements.txt

            - name: Read font version
              id: version
              shell: bash
              run: |
                  tag="$(python -c 'import build; print(f"v{build.VERSION}")')"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "Release version: $tag"

            - name: Check existing release tag
              id: existing
              shell: bash
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  existing="$(git ls-remote --refs --tags origin "refs/tags/${RELEASE_TAG}")"

                  if [[ -n "$existing" ]]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Tag already exists: $RELEASE_TAG"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and validate both OTFs
              if: steps.existing.outputs.exists == 'false'
              run: python build.py

            - name: Package exactly two fonts
              if: steps.existing.outputs.exists == 'false'
              shell: bash
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  python - <<'PYZIP'
                  import os
                  from pathlib import Path
                  from zipfile import ZIP_DEFLATED, ZipFile
                  from fontTools.ttLib import TTFont

                  root = Path('build/otf')
                  names = ('MK8DNum-Regular.otf', 'MK8DNum-Italic.otf')
                  tag = os.environ['RELEASE_TAG']

                  assert {f.name for f in root.glob('*.otf')} == set(names)

                  for name, style in zip(names, ('Regular', 'Italic')):
                      with TTFont(root / name) as font:
                          assert font['name'].getDebugName(1) == 'MK8DNum'
                          assert font['name'].getDebugName(2) == style
                          assert font['name'].getDebugName(5).endswith(
                              'release ' + tag
                          )

                  out = Path('dist') / f'MK8DNum-{tag}.zip'
                  out.parent.mkdir(parents=True, exist_ok=True)

                  with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
                      for name in names:
                          archive.write(root / name, arcname=name)

                  with ZipFile(out) as archive:
                      assert archive.namelist() == list(names)
                      assert archive.testzip() is None

                  print(f'Created {out}')
                  PYZIP

            - name: Publish GitHub Release
              if: steps.existing.outputs.exists == 'false'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail

                  gh release create "$RELEASE_TAG" \
                    "dist/MK8DNum-${RELEASE_TAG}.zip" \
                    --title "$RELEASE_TAG" \
                    --generate-notes \
                    --target "$GITHUB_SHA"
